<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hap Seng Suki Market | San Jose</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // Replace "YOUR_PUBLIC_KEY" with your actual EmailJS Public Key
            emailjs.init("YOUR_PUBLIC_KEY");
        })();
    </script>
    <style>
        .cart-sidebar { transform: translateX(100%); transition: transform 0.3s ease-in-out; }
        .cart-open .cart-sidebar { transform: translateX(0); }
        .hero-gradient { background: linear-gradient(135deg, #f0fff4 0%, #ffffff 100%); }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <nav class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-40 border-b border-green-100">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black text-green-700 tracking-tight">HAP SENG SUKI MARKET</h1>
                <p class="text-[10px] uppercase tracking-widest text-gray-500 font-bold">San Jose Occidental Mindoro</p>
            </div>
            <button onclick="toggleCart()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2.5 rounded-full font-bold flex items-center gap-2 shadow-lg shadow-green-200 transition-all active:scale-95">
                <span>🛒</span> Cart (<span id="cart-count">0</span>)
            </button>
        </div>
    </nav>

    <header class="hero-gradient overflow-hidden border-b border-green-50">
        <div class="max-w-7xl mx-auto px-4 py-12 md:py-20 flex flex-col md:flex-row items-center gap-12">
            <div class="w-full md:w-1/2 flex justify-center">
                <div class="relative group">
                    <div class="absolute -inset-1 bg-gradient-to-r from-green-400 to-emerald-500 rounded-3xl blur opacity-25"></div>
                    <!-- Referencing "Gemini_Generated_Image_ibaiqtibaiqtibai.png" as "market-welcome.jpg" -->
                    <img src="market-welcome.jpg" alt="Welcome to Hap Seng Suki Market" 
                         class="relative rounded-3xl shadow-2xl w-full max-w-md object-cover aspect-[16/9] border-8 border-white bg-green-100">
                </div>
            </div>
            <div class="w-full md:w-1/2 text-center md:text-left">
                <span class="inline-block px-4 py-1.5 bg-green-100 text-green-700 rounded-full text-sm font-bold mb-6">Serving San Jose with Pride</span>
                <h2 class="text-4xl md:text-6xl font-extrabold text-gray-900 leading-tight mb-6">Freshness <span class="text-green-600">Hand-Picked</span> For Your Family</h2>
                <a href="#shop" class="bg-gray-900 text-white px-10 py-4 rounded-2xl font-bold hover:bg-black transition-all shadow-xl inline-block">Browse Products</a>
            </div>
        </div>
    </header>

    <main id="shop" class="max-w-7xl mx-auto px-4 py-16">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="product-grid"></div>
    </main>

    <div id="cart-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 hidden" onclick="toggleCart()"></div>
    <div id="cart-sidebar" class="fixed right-0 top-0 h-full w-full max-w-md bg-white z-50 shadow-2xl cart-sidebar p-8 flex flex-col">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-black">Your Basket</h2>
            <button onclick="toggleCart()" class="text-2xl">✕</button>
        </div>
        <div id="cart-items" class="flex-grow overflow-y-auto space-y-4 mb-8"></div>
        <div class="border-t pt-6">
            <div class="flex justify-between text-2xl font-bold mb-6">
                <span>Total:</span> <span id="cart-total" class="text-green-700">$0.00</span>
            </div>
            <!-- Added Email field here -->
            <form id="orderForm" class="space-y-4">
                <input type="text" id="custName" placeholder="Full Name" class="w-full border p-4 rounded-xl outline-none focus:ring-2 focus:ring-green-500" required>
                <input type="email" id="custEmail" placeholder="Email Address for Receipt" class="w-full border p-4 rounded-xl outline-none focus:ring-2 focus:ring-green-500" required>
                <input type="tel" id="custPhone" placeholder="Contact Number" class="w-full border p-4 rounded-xl outline-none focus:ring-2 focus:ring-green-500" required>
                <button type="submit" id="submitBtn" class="w-full bg-green-600 text-white py-5 rounded-2xl font-black text-lg">Send Receipt & Order</button>
            </form>
        </div>
        <div id="success-msg" class="hidden absolute inset-0 bg-white z-50 p-12 text-center flex flex-col justify-center items-center">
            <h2 class="text-3xl font-bold mb-4 text-green-600">Receipt Sent!</h2>
            <p class="mb-8">Check your email for your order details.</p>
            <button onclick="location.reload()" class="bg-gray-900 text-white px-8 py-3 rounded-xl font-bold">Back to Store</button>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Premium Suki Beef Slices", price: 15.00, img: "🥩", category: "Meat" },
            { id: 2, name: "Fish Ball Mix (Large)", price: 8.50, img: "🍡", category: "Seafood" },
            { id: 3, name: "Napa Cabbage (Organic)", price: 4.20, img: "🥬", category: "Veggies" },
            { id: 4, name: "Enoki Mushrooms", price: 3.00, img: "🍄", category: "Veggies" },
            { id: 5, name: "Suki Soup Base", price: 5.50, img: "🍲", category: "Pantry" }
        ];

        let cart = [];

        function render() {
            document.getElementById('product-grid').innerHTML = products.map(p => `
                <div class="bg-white rounded-3xl p-5 border border-gray-100 shadow-sm">
                    <div class="h-40 bg-gray-50 rounded-2xl mb-4 flex items-center justify-center text-6xl">${p.img}</div>
                    <h4 class="font-bold text-lg">${p.name}</h4>
                    <p class="text-xl font-black mb-4">$${p.price.toFixed(2)}</p>
                    <button onclick="addToCart(${p.id})" class="w-full bg-gray-100 py-3 rounded-xl font-bold hover:bg-green-600 hover:text-white">Add to Cart</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            cart.push(products.find(p => p.id === id));
            document.getElementById('cart-count').innerText = cart.length;
            const total = cart.reduce((s, i) => s + i.price, 0);
            document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
            document.getElementById('cart-items').innerHTML = cart.map(item => `
                <div class="flex justify-between p-3 bg-gray-50 rounded-xl">
                    <span>${item.name}</span>
                    <b class="text-green-700">$${item.price.toFixed(2)}</b>
                </div>
            `).join('');
        }

        function toggleCart() {
            document.body.classList.toggle('cart-open');
            document.getElementById('cart-overlay').classList.toggle('hidden');
        }

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Sending...";
            btn.disabled = true;

            const orderDetails = cart.map(i => `${i.name} ($${i.price})`).join(", ");
            const total = document.getElementById('cart-total').innerText;

            // EmailJS Logic
            const templateParams = {
                to_name: document.getElementById('custName').value,
                to_email: document.getElementById('custEmail').value,
                order_summary: orderDetails,
                total_amount: total
            };

            // You must set up a free account at emailjs.com to get these IDs
            emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', templateParams)
                .then(function() {
                    document.getElementById('success-msg').classList.remove('hidden');
                }, function(error) {
                    alert("Failed to send receipt. Please check your EmailJS settings.");
                    btn.innerText = "Send Receipt & Order";
                    btn.disabled = false;
                });
        });

        render();
    </script>
</body>
</html>
