index.html
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hap Seng Suki Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cart-sidebar { transform: translateX(100%); transition: transform 0.3s ease-in-out; }
        .cart-open .cart-sidebar { transform: translateX(0); }
        .hidden-el { display: none; }
    </style>
</head>
<body class="bg-gray-50">

    <!-- Navigation -->
    <nav class="bg-white shadow-md sticky top-0 z-40 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-green-600">Hap Seng Suki Market</h1>
            <button onclick="toggleCart()" class="bg-green-600 text-white px-4 py-2 rounded-lg">Cart (<span id="cart-count">0</span>)</button>
        </div>
    </nav>

    <!-- Product Grid -->
    <main class="max-w-7xl mx-auto px-4 py-12">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="product-grid"></div>
    </main>

    <!-- Cart Sidebar -->
    <div id="cart-overlay" class="fixed inset-0 bg-black opacity-50 z-40 hidden" onclick="toggleCart()"></div>
    <div id="cart-sidebar" class="fixed right-0 top-0 h-full w-96 bg-white z-50 shadow-xl cart-sidebar p-6 flex flex-col">
        <div id="cart-content">
            <h2 class="text-xl font-bold mb-4">Your Basket</h2>
            <div id="cart-items" class="space-y-4 mb-6"></div>
            <hr class="mb-4">
            <div class="flex justify-between font-bold text-lg mb-6">
                <span>Total:</span><span id="cart-total">$0.00</span>
            </div>
            
            <!-- Checkout Form -->
            <form id="orderForm" class="space-y-3">
                <input type="text" id="custName" placeholder="Full Name" class="w-full border p-2 rounded" required>
                <input type="email" id="custEmail" placeholder="Email Address" class="w-full border p-2 rounded" required>
                <input type="tel" id="custPhone" placeholder="Phone Number" class="w-full border p-2 rounded" required>
                <button type="submit" id="submitBtn" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold">Complete My Order</button>
            </form>
        </div>

        <!-- Success Message -->
        <div id="success-msg" class="hidden text-center py-12">
            <div class="text-6xl mb-4">✅</div>
            <h2 class="text-2xl font-bold text-green-600 mb-2">Thank You!</h2>
            <p class="text-gray-600">Thank you for your order! We will confirm via call or email about your order and payment shortly.</p>
            <button onclick="location.reload()" class="mt-6 text-blue-600 underline">Back to Shopping</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'YOUR_GOOGLE_SCRIPT_URL_HERE';
        const products = [
            { id: 1, name: "Suki Beef Slices", price: 12.50 },
            { id: 2, name: "Fish Ball Mix", price: 6.00 },
            { id: 3, name: "Napa Cabbage", price: 3.20 }
        ];

        let cart = [];

        function renderProducts() {
            document.getElementById('product-grid').innerHTML = products.map(p => `
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-lg">${p.name}</h3>
                    <p class="text-green-600 mb-4">$${p.price.toFixed(2)}</p>
                    <button onclick="addToCart(${p.id})" class="w-full bg-gray-100 py-2 rounded hover:bg-green-100 transition">Add to Cart</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            cart.push(products.find(p => p.id === id));
            updateUI();
        }

        function updateUI() {
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('cart-items').innerHTML = cart.map((item, i) => `
                <div class="flex justify-between text-sm">
                    <span>${item.name}</span><span>$${item.price.toFixed(2)}</span>
                </div>
            `).join('');
            const total = cart.reduce((s, i) => s + i.price, 0);
            document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
        }

        function toggleCart() { document.body.classList.toggle('cart-open'); document.getElementById('cart-overlay').classList.toggle('hidden'); }

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (cart.length === 0) return alert("Cart is empty!");
            
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Processing...";
            btn.disabled = true;

            const orderData = {
                name: document.getElementById('custName').value,
                email: document.getElementById('custEmail').value,
                phone: document.getElementById('custPhone').value,
                items: cart.map(i => i.name).join(", "),
                total: document.getElementById('cart-total').innerText
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(orderData)
            })
            .then(res => {
                document.getElementById('cart-content').classList.add('hidden');
                document.getElementById('success-msg').classList.remove('hidden');
            })
            .catch(err => alert("Error submitting order. Please try again."));
        });

        renderProducts();
    </script>
</body>
</html>
